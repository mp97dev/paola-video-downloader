name: Run Python Script

on:
  workflow_dispatch:
    inputs:
        title:
          description: "Title of the video"
          required: true
          type: string
        link:
          description: "Link to the video"
          required: true
          type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📝 Create Data File
        run: |
          python3 -c "
          import json, sys
          data = {'title': sys.argv[1], 'link': sys.argv[2]}
          print(json.dumps(data))
          " "${{ github.event.inputs.title }}" "${{ github.event.inputs.link }}" > data.json

      - name: 🔑 Create Google Credentials File
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: echo "$GDRIVE_CREDENTIALS" > auth.json

      - name: 🍪 Setup Cookies
        env:
          COOKIES_B64: ${{ secrets.COOKIES }}
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
          fi

      - name: ⚙️ Run install
        run: ./install.sh

      - name: 🐍 Run Python Script
        id: download
        env:
          COOKIES_FILE: cookies.txt
        run: |
          set +e
          venv/bin/python3 src/app.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          # Codes 2 and 3 are download-side failures: swallow them here so the nightly
          # retry below gets a turn. Code 3 (cookies) is included on purpose — Instagram
          # returns the same "empty media response" for a rate limit, a deleted post and
          # a broken extractor, so a nightly attempt is worth ~20s before giving up.
          # Code 1 (bad input, upload failure) fails the job now: yt-dlp cannot help.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: 🌙 Retry with yt-dlp nightly
        if: steps.download.outputs.exit_code == '2' || steps.download.outputs.exit_code == '3'
        env:
          COOKIES_FILE: cookies.txt
        run: |
          echo "[II] stable yt-dlp failed; retrying with the nightly build"
          venv/bin/pip install -U --pre "yt-dlp[default]"
          venv/bin/python3 -m yt_dlp --version
          venv/bin/python3 src/app.py
